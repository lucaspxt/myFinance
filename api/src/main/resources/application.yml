spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:myfinance}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.myfinance.ai: DEBUG

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      model-name: ${OPENAI_MODEL:gpt-4o-mini}
      temperature: 0.7
    embedding-model:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      model-name: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  pgvector:
    embedding-store:
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:5433}
      database: ${POSTGRES_DB:myfinance}
      user: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:postgres}
      table: embeddings
      dimension: 1536
      create-table: true
      drop-table-first: false
