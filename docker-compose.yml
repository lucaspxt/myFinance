services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: myfinance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myfinance}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
