# Nginx configuration for lead-web (landing page)
# Place this file in /etc/nginx/sites-available/lead-web
# Then: sudo ln -s /etc/nginx/sites-available/lead-web /etc/nginx/sites-enabled/

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    
    server_name chat.quasterai.com;
    
    return 301 https://$server_name$request_uri;
}

# HTTPS configuration
server {
     listen 443 ssl http2;
     listen [::]:443 ssl http2;
     
     server_name chat.quasterai.com;
     
     ssl_certificate /etc/letsencrypt/live/chat.quasterai.com/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/chat.quasterai.com/privkey.pem;
     
     root /var/www/lead-web;
     index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
